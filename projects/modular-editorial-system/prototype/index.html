<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article Studio — Live prototype</title>
    <!-- Google tag (gtag.js) -->
    <script>
      const hostname = window.location.hostname;
      const isPrivateNetwork =
        /^(192\.168\.|10\.|127\.)/.test(hostname) ||
        /^172\.(1[6-9]|2\d|3[0-1])\./.test(hostname);
      const isLocalEnvironment =
        ["localhost", "0.0.0.0", "::1", "[::1]"].includes(hostname) || isPrivateNetwork;

      // Visit any page with ?ga_optout=1 to stop counting this browser (?ga_optout=0 undoes it).
      let isOwnerBrowser = false;
      try {
        const gaOptOutKey = "pf-ga-opt-out";
        const pageUrl = new URL(window.location.href);
        const gaOptOutParam = pageUrl.searchParams.get("ga_optout");
        if (gaOptOutParam === "1") window.localStorage.setItem(gaOptOutKey, "1");
        if (gaOptOutParam === "0") window.localStorage.removeItem(gaOptOutKey);
        if (gaOptOutParam !== null) {
          pageUrl.searchParams.delete("ga_optout");
          window.history.replaceState(window.history.state, "", pageUrl);
        }
        isOwnerBrowser = window.localStorage.getItem(gaOptOutKey) === "1";
      } catch (error) {
        // Storage can be unavailable (private mode, blocked cookies); keep the default.
      }

      if (!isLocalEnvironment && !isOwnerBrowser) {
        window.dataLayer = window.dataLayer || [];
        // Google tag commands require an Arguments object, not an Array.
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());
        // navigate (new visit or link), reload, or back_forward (e.g. returning from a case study).
        const navigationType =
          window.performance?.getEntriesByType?.("navigation")[0]?.type || "unknown";
        window.gtag("config", "G-ZYEBT08N8L", {
          navigation_type: navigationType,
        });

        const googleTagScript = document.createElement("script");
        googleTagScript.async = true;
        googleTagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-ZYEBT08N8L";
        document.head.append(googleTagScript);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../../../src/prototypes/modular-editorial-system/main.jsx"></script>
  </body>
</html>
