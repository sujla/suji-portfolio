<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article Studio — Live prototype</title>
    <!-- Google tag (gtag.js) -->
    <script>
      const hostname = window.location.hostname;
      const isPrivateNetwork =
        /^(192\.168\.|10\.|127\.)/.test(hostname) ||
        /^172\.(1[6-9]|2\d|3[0-1])\./.test(hostname);
      const isLocalEnvironment =
        ["localhost", "0.0.0.0", "::1", "[::1]"].includes(hostname) || isPrivateNetwork;

      if (!isLocalEnvironment) {
        window.dataLayer = window.dataLayer || [];
        // Google tag commands require an Arguments object, not an Array.
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());
        window.gtag("config", "G-ZYEBT08N8L");

        const googleTagScript = document.createElement("script");
        googleTagScript.async = true;
        googleTagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-ZYEBT08N8L";
        document.head.append(googleTagScript);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../../../src/prototypes/modular-editorial-system/main.jsx"></script>
  </body>
</html>
