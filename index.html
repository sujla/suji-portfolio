<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("portfolio-theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch {}
      })();
    </script>
    <title>Suji Kweon</title>
    <meta property="og:title" content="Suji's Portfolio" />
    <meta property="og:image" content="https://sujla.github.io/suji-portfolio/assets/about6.jpeg" />
    <link rel="icon" href="./assets/common/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fjord+One&family=Google+Sans+Code:wght@400;500&family=Host+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <!-- Google tag (gtag.js) -->
    <script>
      const hostname = window.location.hostname;
      const isPrivateNetwork =
        /^(192\.168\.|10\.|127\.)/.test(hostname) ||
        /^172\.(1[6-9]|2\d|3[0-1])\./.test(hostname);
      const isLocalEnvironment =
        ["localhost", "0.0.0.0", "::1", "[::1]"].includes(hostname) || isPrivateNetwork;

      if (!isLocalEnvironment) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = (...args) => window.dataLayer.push(args);
        window.gtag("js", new Date());
        window.gtag("config", "G-ZYEBT08N8L");

        const googleTagScript = document.createElement("script");
        googleTagScript.async = true;
        googleTagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-ZYEBT08N8L";
        document.head.append(googleTagScript);
      }
    </script>
  </head>
  <body id="top" class="index-page">
    <div id="root"></div>
    <script type="module" src="./src/home/main.jsx"></script>
  </body>
</html>
